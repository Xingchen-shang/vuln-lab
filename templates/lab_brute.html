{% extends "base.html" %}
{% block title %}暴力破解靶场 · 漏洞教学靶场{% endblock %}
{% block content %}
<h1>🎯 暴力破解靶场</h1>
<p class="lead">目标：爆破出 victim 的弱口令，登录拿 flag。</p>

<div class="card">
  <h2>登录</h2>
  <form method="post">
    <label>用户名 <input type="text" name="username" value="victim"></label>
    <label>密码 <input type="password" name="password"></label>
    <button type="submit">登录</button>
  </form>
  {% if result %}
    <div class="result {{ 'ok' if flag else 'fail' }}">{{ result }}</div>
    {% if flag %}<div class="flag">🏁 {{ flag }}</div>{% endif %}
  {% endif %}
</div>
{% endblock %}
